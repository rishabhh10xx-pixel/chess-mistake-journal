<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Mistake Journal</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f3f4f6;
  color:#111827;
}
header{
  background:#111827;
  color:white;
  padding:25px 18px;
}
h1{margin:0 0 8px}
.container{
  max-width:850px;
  margin:auto;
  padding:18px;
}
.card{
  background:white;
  padding:20px;
  margin-bottom:18px;
  border-radius:16px;
  box-shadow:0 3px 12px #0001;
}
textarea{
  width:100%;
  height:220px;
  box-sizing:border-box;
  padding:14px;
  border:2px solid #ddd;
  border-radius:12px;
  font-family:monospace;
}
button{
  border:0;
  padding:14px 20px;
  border-radius:10px;
  font-weight:bold;
  margin-top:12px;
  cursor:pointer;
}
.analyze{
  width:100%;
  background:#2563eb;
  color:white;
  font-size:17px;
}
.stats{
  display:flex;
  gap:10px;
}
.stat{
  flex:1;
  text-align:center;
  background:#eef2ff;
  padding:15px;
  border-radius:12px;
}
.stat b{
  display:block;
  font-size:28px;
}
.mistake{
  background:#fff1f2;
  border-left:5px solid #ef4444;
  padding:15px;
  margin:10px 0;
  border-radius:8px;
}
.good{
  background:#ecfdf5;
  border-left:5px solid #22c55e;
  padding:15px;
  border-radius:8px;
}
</style>
</head>

<body>

<header>
<h1>♟ Chess Mistake Journal</h1>
<p>Track mistakes. Find patterns. Improve your chess.</p>
</header>

<div class="container">

<div class="card">
<h2>PGN Analyzer</h2>

<p>Chess.com ka PGN yahan paste karo:</p>

<textarea id="pgn"
placeholder='[Event "Chess.com"]
[White "Rishabh11x"]
[Black "Opponent"]

1. e4 e5 2. Nf3 Nc6 3. Bb5 a6'></textarea>

<button class="analyze" onclick="analyzePGN()">
🔍 Analyze Game
</button>

<p id="status"></p>
</div>

<div class="card">
<div class="stats">
<div class="stat">
<b id="mistakes">0</b>
Mistakes
</div>

<div class="stat">
<b id="blunders">0</b>
Blunders
</div>

<div class="stat">
<b id="moves">0</b>
Moves
</div>
</div>
</div>

<div class="card">
<h2>📊 Result</h2>
<div id="result">
PGN paste karke Analyze Game dabao.
</div>
</div>

</div>

<script>

function escapeHTML(text){
return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function getHeaders(pgn){

let headers={};
let regex=/([A-Za-z0-9_]+)\s+"([^"]*)"/g;
let match;

while((match=regex.exec(pgn))!==null){
headers[match[1]]=match[2];
}

return headers;
}

function analyzePGN(){

let pgn=document.getElementById("pgn").value.trim();

let result=document.getElementById("result");
let status=document.getElementById("status");

if(!pgn){

result.innerHTML=
"<div class='mistake'>❌ Pehle PGN paste karo.</div>";

return;
}

let chess=new Chess();

let loaded=chess.load_pgn(pgn,{sloppy:true});

if(!loaded){

result.innerHTML=
"<div class='mistake'>❌ PGN read nahi ho raha. Chess.com se original PGN copy karo.</div>";

return;
}
